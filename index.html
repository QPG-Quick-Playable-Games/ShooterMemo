<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Web Arena Shooter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            margin-left: -5px;
            margin-top: -5px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #444;
            cursor: pointer;
        }
        h1 { margin-top: 0; color: #ff3333; font-size: 28px; }
        p { color: #ccc; font-size: 16px; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="ui">
        Score: <span id="score">0</span> | Health: <span id="health">100</span>
    </div>
    <div id="crosshair"></div>
    
    <div id="instructions">
        <h1>3D ARENA SHOOTER</h1>
        <p><strong>WASD</strong> to Move | <strong>Mouse</strong> to Aim | <strong>Click</strong> to Shoot</p>
        <p style="color: #4CAF50; font-weight: bold;">Click here to start the game!</p>
    </div>

    <!-- Include Three.js and PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let score = 0, health = 100;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        
        const bullets = [];
        const targets = [];
        const raycaster = new THREE.Raycaster();

        init();
        animate();

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a12);
            scene.fog = new THREE.FogExp2(0x0a0a12, 0.025);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6;

            // Renderer Setup with Shadows
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.PointerLockControls(camera, document.body);
            
            const instructions = document.getElementById('instructions');
            instructions.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                instructions.style.display = 'block';
            });

            scene.add(controls.getObject());

            // Lighting for Good Graphics
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffaa00, 1.5, 50);
            pointLight.position.set(0, 8, 0);
            pointLight.castShadow = true;
            scene.add(pointLight);

            const dirLight = new THREE.DirectionalLight(0x3366ff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Arena Environment (Floor & Walls)
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.8, metalness: 0.2 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Grid lines on floor for futuristic aesthetic
            const grid = new THREE.GridHelper(100, 50, 0x00ffff, 0x333344);
            grid.position.y = 0.01;
            scene.add(grid);

            // Obstacles / Cover Boxes
            const boxGeo = new THREE.BoxGeometry(3, 3, 3);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.5, metalness: 0.5 });
            
            for (let i = 0; i < 15; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.x = (Math.random() - 0.5) * 60;
                box.position.y = 1.5;
                box.position.z = (Math.random() - 0.5) * 60;
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
            }

            // Spawn Targets (Enemies)
            for (let i = 0; i < 6; i++) {
                spawnTarget();
            }

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
        }

        function spawnTarget() {
            const targetGeo = new THREE.SphereGeometry(1, 32, 32);
            const targetMat = new THREE.MeshStandardMaterial({ color: 0xff3355, emissive: 0x441122, roughness: 0.3 });
            const target = new THREE.Mesh(targetGeo, targetMat);
            
            target.position.x = (Math.random() - 0.5) * 70;
            target.position.y = 1 + Math.random() * 3;
            target.position.z = (Math.random() - 0.5) * 70;
            target.castShadow = true;
            
            scene.add(target);
            targets.push(target);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseDown() {
            if (!controls.isLocked) return;

            // Shoot Bullet
            const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.copy(camera.position);
            
            const vector = new THREE.Vector3();
            camera.getWorldDirection(vector);
            bullet.velocity = vector.multiplyScalar(2.0);
            
            scene.add(bullet);
            bullets.push(bullet);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Update Bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.position.add(b.velocity);

                    // Check Collision with Targets
                    for (let j = targets.length - 1; j >= 0; j--) {
                        const t = targets[j];
                        if (b.position.distanceTo(t.position) < 1.2) {
                            scene.remove(t);
                            targets.splice(j, 1);
                            scene.remove(b);
                            bullets.splice(i, 1);
                            
                            score += 10;
                            document.getElementById('score').innerText = score;
                            spawnTarget();
                            break;
                        }
                    }

                    // Remove out of bounds bullets
                    if (b && b.position.length() > 100) {
                        scene.remove(b);
                        bullets.splice(i, 1);
                    }
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
