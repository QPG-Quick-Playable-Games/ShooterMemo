<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D HTML5 FPS Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    /* UI Overlay */
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      z-index: 10;
      pointer-events: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-top: -5px;
      margin-left: -5px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      z-index: 10;
      pointer-events: none;
    }
    /* Start Screen */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    #start-screen h1 {
      font-size: 42px;
      margin-bottom: 20px;
      color: #ff4444;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #start-screen p {
      font-size: 16px;
      margin-bottom: 30px;
      text-align: center;
      line-height: 1.6;
      max-width: 500px;
    }
    #start-btn {
      padding: 15px 40px;
      font-size: 20px;
      font-weight: bold;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 68, 68, 0.5);
    }
    #start-btn:active {
      transform: scale(0.98);
    }
    /* Mobile Controls */
    .touch-zone {
      position: absolute;
      bottom: 20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      z-index: 15;
      touch-action: none;
    }
    #move-zone { left: 20px; }
    #look-zone { right: 20px; }
    .joystick-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      margin-top: -20px;
      margin-left: -20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }
    #mobile-shoot-btn {
      position: absolute;
      bottom: 160px;
      right: 35px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 15;
      touch-action: none;
    }
    /* Hide touch controls on desktop by default */
    @media (pointer: fine) {
      .touch-controls { display: none; }
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div>Score: <span id="score">0</span></div>
      <div>Targets Left: <span id="targets">0</span></div>
    </div>
    <div id="crosshair"></div>

    <!-- Start Overlay -->
    <div id="start-screen">
      <h1>3D Target Shooter</h1>
      <p>
        <strong>PC:</strong> WASD to Move, Mouse to Look, Left-Click to Shoot.<br />
        <strong>Mobile:</strong> Left Joystick to Move, Right Joystick to Look, Red Button to Shoot.
      </p>
      <button id="start-btn">PLAY GAME</button>
    </div>

    <!-- Mobile Controls -->
    <div class="touch-controls">
      <div id="move-zone" class="touch-zone">
        <div id="move-handle" class="joystick-handle"></div>
      </div>
      <div id="look-zone" class="touch-zone">
        <div id="look-handle" class="joystick-handle"></div>
      </div>
      <div id="mobile-shoot-btn">FIRE</div>
    </div>
  </div>

  <script>
    // --- Global Game State & Setup ---
    let scene, camera, renderer;
    let targets = [];
    let score = 0;
    const TOTAL_TARGETS = 10;
    let isGameRunning = false;

    // Camera Physics & Rotation
    const velocity = new THREE.Vector3();
    const moveDirection = new THREE.Vector3();
    let yaw = 0;
    let pitch = 0;
    const moveSpeed = 12.0;

    // Controls tracking
    const keys = { w: false, a: false, s: false, d: false };
    const moveTouch = { active: false, id: null, startX: 0, startY: 0, deltaX: 0, deltaY: 0 };
    const lookTouch = { active: false, id: null, startX: 0, startY: 0, deltaX: 0, deltaY: 0 };

    // Audio Context (Synthesized Sounds)
    let audioCtx;

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playGunshotSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // --- Scene Initialization ---
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb); // Sky blue
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 0); // Eye height

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.getElementById('game-container').appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Environment: Floor
      const floorGeo = new THREE.PlaneGeometry(100, 100);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x3a5a40 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Environment: Enclosing Walls
      createWalls();

      // Gun Model Attached to Camera
      createGun();

      // Targets
      spawnTargets();

      // Window Resize Listener
      window.addEventListener('resize', onWindowResize);

      // Setup Inputs
      setupPCControls();
      setupMobileControls();
    }

    function createWalls() {
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
      const wallGeo = new THREE.BoxGeometry(100, 10, 2);

      const north = new THREE.Mesh(wallGeo, wallMat); north.position.set(0, 5, -50);
      const south = new THREE.Mesh(wallGeo, wallMat); south.position.set(0, 5, 50);
      const east = new THREE.Mesh(wallGeo, wallMat); east.position.set(50, 5, 0); east.rotation.y = Math.PI / 2;
      const west = new THREE.Mesh(wallGeo, wallMat); west.position.set(-50, 5, 0); west.rotation.y = Math.PI / 2;

      scene.add(north, south, east, west);
    }

    function createGun() {
      const gunGroup = new THREE.Group();
      const barrelGeo = new THREE.BoxGeometry(0.1, 0.1, 0.5);
      const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      const barrel = new THREE.Mesh(barrelGeo, gunMat);
      barrel.position.set(0.2, -0.25, -0.4);
      gunGroup.add(barrel);
      camera.add(gunGroup);
      scene.add(camera);
    }

    function spawnTargets() {
      const targetGeo = new THREE.SphereGeometry(1, 16, 16);
      const targetMat = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.3 });

      for (let i = 0; i < TOTAL_TARGETS; i++) {
        const target = new THREE.Mesh(targetGeo, targetMat);
        target.castShadow = true;
        resetTargetPosition(target);
        scene.add(target);
        targets.push(target);
      }
      document.getElementById('targets').innerText = targets.length;
    }

    function resetTargetPosition(target) {
      target.position.x = (Math.random() - 0.5) * 80;
      target.position.y = 1 + Math.random() * 5;
      target.position.z = (Math.random() - 0.5) * 80;
    }

    // --- Shooting Logic ---
    function shoot() {
      if (!isGameRunning) return;
      playGunshotSound();

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const intersects = raycaster.intersectObjects(targets);
      if (intersects.length > 0) {
        const hitTarget = intersects[0].object;
        playHitSound();
        resetTargetPosition(hitTarget);
        score += 100;
        document.getElementById('score').innerText = score;
      }
    }

    // --- Controls Implementation ---
    function setupPCControls() {
      document.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') keys.w = true;
        if (e.code === 'KeyA') keys.a = true;
        if (e.code === 'KeyS') keys.s = true;
        if (e.code === 'KeyD') keys.d = true;
      });

      document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') keys.w = false;
        if (e.code === 'KeyA') keys.a = false;
        if (e.code === 'KeyS') keys.s = false;
        if (e.code === 'KeyD') keys.d = false;
      });

      document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === document.body) {
          yaw -= e.movementX * 0.002;
          pitch -= e.movementY * 0.002;
          pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
        }
      });

      document.addEventListener('mousedown', (e) => {
        if (document.pointerLockElement === document.body && e.button === 0) {
          shoot();
        }
      });
    }

    function setupMobileControls() {
      const moveZone = document.getElementById('move-zone');
      const moveHandle = document.getElementById('move-handle');
      const lookZone = document.getElementById('look-zone');
      const lookHandle = document.getElementById('look-handle');
      const shootBtn = document.getElementById('mobile-shoot-btn');

      // Movement Joystick
      moveZone.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        moveTouch.active = true;
        moveTouch.id = touch.identifier;
        moveTouch.startX = touch.clientX;
        moveTouch.startY = touch.clientY;
      });

      moveZone.addEventListener('touchmove', (e) => {
        if (!moveTouch.active) return;
        for (let touch of e.changedTouches) {
          if (touch.identifier === moveTouch.id) {
            let dx = touch.clientX - moveTouch.startX;
            let dy = touch.clientY - moveTouch.startY;
            const dist = Math.min(50, Math.hypot(dx, dy));
            const angle = Math.atan2(dy, dx);
            
            dx = Math.cos(angle) * dist;
            dy = Math.sin(angle) * dist;

            moveHandle.style.transform = `translate(${dx}px, ${dy}px)`;
            moveTouch.deltaX = dx / 50;
            moveTouch.deltaY = dy / 50;
          }
        }
      });

      const resetMoveJoystick = (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === moveTouch.id) {
            moveTouch.active = false;
            moveTouch.deltaX = 0;
            moveTouch.deltaY = 0;
            moveHandle.style.transform = `translate(0px, 0px)`;
          }
        }
      };
      moveZone.addEventListener('touchend', resetMoveJoystick);
      moveZone.addEventListener('touchcancel', resetMoveJoystick);

      // Camera Look Joystick
      lookZone.addEventListener('touchstart', (e) => {
        const touch = e.changedTouches[0];
        lookTouch.active = true;
        lookTouch.id = touch.identifier;
        lookTouch.startX = touch.clientX;
        lookTouch.startY = touch.clientY;
      });

      lookZone.addEventListener('touchmove', (e) => {
        if (!lookTouch.active) return;
        for (let touch of e.changedTouches) {
          if (touch.identifier === lookTouch.id) {
            let dx = touch.clientX - lookTouch.startX;
            let dy = touch.clientY - lookTouch.startY;
            const dist = Math.min(50, Math.hypot(dx, dy));
            const angle = Math.atan2(dy, dx);
            
            dx = Math.cos(angle) * dist;
            dy = Math.sin(angle) * dist;

            lookHandle.style.transform = `translate(${dx}px, ${dy}px)`;
            
            // Adjust camera look based on delta frame-by-frame
            yaw -= (dx / 50) * 0.04;
            pitch -= (dy / 50) * 0.04;
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));

            lookTouch.startX = touch.clientX;
            lookTouch.startY = touch.clientY;
          }
        }
      });

      const resetLookJoystick = (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === lookTouch.id) {
            lookTouch.active = false;
            lookHandle.style.transform = `translate(0px, 0px)`;
          }
        }
      };
      lookZone.addEventListener('touchend', resetLookJoystick);
      lookZone.addEventListener('touchcancel', resetLookJoystick);

      // Mobile Shoot Button
      shootBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        shoot();
      });
    }

    // --- Game Loop ---
    let clock = new THREE.Clock();

    function update() {
      const delta = clock.getDelta();

      if (isGameRunning) {
        // Update Camera Orientation
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        // Calculate Movement Vector
        moveDirection.set(0, 0, 0);

        // PC Movement Inputs
        if (keys.w) moveDirection.z -= 1;
        if (keys.s) moveDirection.z += 1;
        if (keys.a) moveDirection.x -= 1;
        if (keys.d) moveDirection.x += 1;

        // Mobile Movement Inputs
        if (moveTouch.active) {
          moveDirection.x += moveTouch.deltaX;
          moveDirection.z += moveTouch.deltaY;
        }

        moveDirection.normalize();

        // Translate relative to camera facing angle (yaw)
        if (moveDirection.lengthSq() > 0) {
          const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
          const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

          velocity.x = (forward.x * -moveDirection.z + side.x * moveDirection.x) * moveSpeed * delta;
          velocity.z = (forward.z * -moveDirection.z + side.z * moveDirection.x) * moveSpeed * delta;

          camera.position.x += velocity.x;
          camera.position.z += velocity.z;
        }

        // Keep player bounded within room arena
        camera.position.x = Math.max(-48, Math.min(48, camera.position.x));
        camera.position.z = Math.max(-48, Math.min(48, camera.position.z));
      }

      renderer.render(scene, camera);
      requestAnimationFrame(update);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Start Game Flow ---
    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      document.getElementById('start-screen').style.display = 'none';
      isGameRunning = true;

      // Lock pointer for PC desktop
      if (!('ontouchstart' in window)) {
        document.body.requestPointerLock();
      }
    });

    // Run Engine
    init();
    update();
  </script>
</body>
</html>
